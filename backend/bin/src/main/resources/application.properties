# ===== MySQL Configuration =====
spring.datasource.url=jdbc:mysql://localhost:3306/exam_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== Server =====
server.port=8080

# ===== JWT =====
jwt.secret=ExamManagementSecretKeyMustBeAtLeast256BitsLongForHS256Algorithm2024
jwt.expiration=86400000
