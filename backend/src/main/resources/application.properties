# ===== Default Database Configuration (H2 in MySQL mode with persistent file storage) =====
# To switch to external MySQL: run with --spring.profiles.active=mysql or set SPRING_PROFILES_ACTIVE=mysql
spring.datasource.url=jdbc:h2:file:./data/examdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Server =====
server.port=${PORT:8080}

# ===== JWT =====
jwt.secret=ExamManagementSecretKeyMustBeAtLeast256BitsLongForHS256Algorithm2024
jwt.expiration=86400000
